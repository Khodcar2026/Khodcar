<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>خودکار</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="
  var s=document.createElement('script');
  s.src='https://unpkg.com/@supabase/supabase-js@2';
  document.head.appendChild(s);
"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0a0a0a;--ink-2:#444;--ink-3:#888;--ink-4:#bbb;
  --surface:#fff;--bg:#f0f0f3;--s2:#f8f8f8;--s3:#f2f2f5;
  --border:#ececec;--b2:#f0f0f0;
  --like:#e0245e;--repost:#17bf63;--save:#f59e0b;--pin:#dc2020;
  --radius:12px;--pill:999px;
}
/* Dark mode: toggled by the .dark class on <body> (session-only) */
body.dark{
  --ink:#f2f2f4;--ink-2:#cfcfd2;--ink-3:#94949a;--ink-4:#5c5c62;
  --surface:#151519;--bg:#0b0b0e;--s2:#1c1c22;--s3:#232329;
  --border:#2b2b32;--b2:#26262c;
}
body.dark .header{background:rgba(15,15,18,.94)}
body.dark .nb.active{background:#2b2b32}
body.dark .nb.primary,body.dark .toast,body.dark .loc-btn.active,
body.dark .cmt-edit-save,body.dark .cmt-send,body.dark .btn-primary,
body.dark .btn-friend{background:#eceef0;color:#0b0b0e}
body.dark .btn-primary:hover,body.dark .nb.primary:hover{background:#fff}
body.dark .dropdown{background:#1c1c22;box-shadow:0 8px 32px rgba(0,0,0,.5)}
body.dark .compose-area:focus,body.dark .loc-input:focus,
body.dark .search-box:focus-within,body.dark .cmt-input:focus,
body.dark .field-input:focus{background:#202026}
body.dark .cmt-edit-input{background:#202026;color:var(--ink)}
body.dark .auth-error{background:#2a1418;border-color:#5c1f28;color:#f7a8b5}
body.dark .badge-friends{background:#0c2a3d;color:#7dd3fc}
body.dark .badge-temp{background:#3a2a08;color:#fcd34d}
body.dark .badge-edited{background:#232329;color:#9a9aa2}
body.dark .badge-pinned{background:#3a1414;color:#f87171}
body.dark .search-hashtag-icon,body.dark .hashtag-icon-lg{background:#0c2a3d;color:#7dd3fc}
body.dark .cmt-priv-badge{background:#241a3a;color:#c4b5fd}
.theme-toggle{background:none;border:1.5px solid var(--border);border-radius:var(--pill);width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-3);flex-shrink:0;transition:border-color .15s,color .15s}
.theme-toggle:hover{border-color:#bbb;color:var(--ink)}
.notif-badge{position:absolute;top:-2px;left:2px;background:var(--like);color:#fff;font-size:9.5px;font-weight:800;min-width:15px;height:15px;border-radius:var(--pill);display:flex;align-items:center;justify-content:center;padding:0 3px;line-height:1}

/* ── Notifications ── */
.notif-item{display:flex;gap:11px;align-items:flex-start;padding:13px 20px;border-bottom:1px solid var(--b2);cursor:pointer;transition:background .1s}
.notif-item:hover{background:var(--s2)}
.notif-item.unread{background:var(--s2)}
body.dark .notif-item.unread{background:#1a1a22}
.notif-icon-wrap{position:relative;flex-shrink:0}
.notif-type-icon{position:absolute;bottom:-4px;left:-4px;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid var(--surface);color:#fff}
.notif-type-icon svg{display:block}
.notif-type-icon.like{background:var(--like)}
.notif-type-icon.repost{background:var(--repost)}
.notif-type-icon.comment{background:#0ea5e9}
.notif-type-icon.follow,.notif-type-icon.friend_accept{background:#7c3aed}
.notif-type-icon.friend_request{background:#f59e0b}
.notif-type-icon.mention{background:#0ea5e9}
.notif-body{flex:1;min-width:0}
.notif-text{font-size:13.5px;line-height:1.7;color:var(--ink)}
.notif-text b{font-weight:700}
.notif-preview{font-size:12px;color:var(--ink-3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.notif-time{font-size:11px;color:var(--ink-4);margin-top:4px}
.notif-unread-dot{width:8px;height:8px;background:#0ea5e9;border-radius:50%;flex-shrink:0;margin-top:6px}
.notif-header-row{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--b2)}
.notif-header-row b{font-size:15px}

/* ── Discover ── */
.discover-section{padding:16px 20px}
.discover-title{font-size:14.5px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:7px}
.discover-hashtag-grid{display:flex;flex-direction:column;gap:2px}
.discover-hashtag-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--b2);cursor:pointer}
.discover-hashtag-rank{font-size:15px;font-weight:800;color:var(--ink-4);width:20px}
.discover-people-scroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.discover-people-scroll::-webkit-scrollbar{display:none}
.discover-person-card{flex-shrink:0;width:130px;border:1.5px solid var(--border);border-radius:14px;padding:14px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.discover-person-card .avatar{cursor:pointer}
.discover-person-name{font-size:12.5px;font-weight:700;cursor:pointer;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.discover-person-handle{font-size:11px;color:var(--ink-3);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── Edit profile sheet ── */
.edit-profile-sheet{position:fixed;inset:0;z-index:900;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.edit-profile-card{background:var(--surface);color:var(--ink);width:100%;max-width:480px;max-height:88vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 20px 24px}
.edit-photo-row{display:flex;gap:10px;margin-bottom:16px}
.edit-photo-btn{flex:1;border:1.5px solid var(--border);border-radius:12px;padding:10px;text-align:center;font-size:12.5px;color:var(--ink-2);cursor:pointer;background:var(--s2)}
.edit-photo-btn:hover{border-color:#bbb}
.edit-photo-remove{color:#dc2626;font-size:11px;margin-top:4px;cursor:pointer;text-decoration:underline}
.bio-textarea{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;font-size:13.5px;font-family:inherit;outline:none;background:var(--s2);color:var(--ink);resize:none;min-height:70px;transition:border-color .15s}
.bio-textarea:focus{border-color:var(--ink);background:#fff}
body{font-family:'Vazirmatn',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh}
.shell{max-width:640px;margin:0 auto;background:var(--surface);min-height:100vh;border-left:1px solid var(--border);border-right:1px solid var(--border)}

/* ── Header ── */
.header{position:sticky;top:0;z-index:300;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border);height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.logo{font-weight:800;font-size:19px;letter-spacing:-.04em;color:var(--ink);cursor:pointer;user-select:none}
.nav{display:flex;align-items:center;gap:2px}
.nb{background:none;border:none;border-radius:var(--pill);padding:6px 12px;cursor:pointer;font-size:13px;font-family:inherit;color:var(--ink-3);font-weight:500;transition:background .15s,color .15s;white-space:nowrap;display:flex;align-items:center;gap:5px}
.nb:hover{background:var(--s2);color:var(--ink)}
.nb.active{background:#efefef;color:var(--ink);font-weight:700}
.nb.primary{background:var(--ink);color:#fff;font-weight:700}
.nb.primary:hover{background:#222}
.nb.ghost{border:1.5px solid var(--border);color:var(--ink-3)}
.nb.ghost:hover{border-color:#bbb;color:var(--ink)}

/* ── Toast ── */
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-14px);background:var(--ink);color:#fff;padding:10px 20px;border-radius:var(--pill);font-size:13px;font-weight:600;z-index:9999;box-shadow:0 6px 28px rgba(0,0,0,.18);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── Views ── */
.view{display:none}.view.active{display:block}

/* ── Tabs ── */
.trending-wrap{padding:12px 20px;border-bottom:1px solid var(--b2)}
.trending-title{font-size:12px;font-weight:700;color:var(--ink-3);margin-bottom:8px}
.trending-pills{display:flex;gap:8px;flex-wrap:wrap}
.trending-pill{background:var(--s2);border:1.5px solid var(--border);border-radius:var(--pill);padding:6px 13px;font-size:12.5px;color:var(--ink-2);cursor:pointer;display:flex;align-items:center;gap:5px;font-family:inherit;transition:background .12s,border-color .12s}
.trending-pill:hover{background:var(--s3);border-color:#bbb}
.trending-pill-count{color:var(--ink-4);font-size:11px}
.tabs{display:flex;border-bottom:1.5px solid var(--b2)}
.tab{flex:1;background:none;border:none;padding:13px 0;font-size:13.5px;font-family:inherit;color:var(--ink-3);cursor:pointer;font-weight:500;border-bottom:2.5px solid transparent;margin-bottom:-1.5px;transition:color .15s,border-color .15s}
.tab.active{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}

/* ── Compose drawer ── */
.compose-drawer{overflow:hidden;max-height:0;transition:max-height .35s cubic-bezier(.4,0,.2,1);border-bottom:1px solid var(--b2)}
.compose-drawer.open{max-height:780px}
.compose-drawer-inner{padding:16px 20px}
.compose-toolbar{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.fmt-btn{background:none;border:1.5px solid var(--border);border-radius:7px;padding:4px 9px;cursor:pointer;font-size:12.5px;font-family:inherit;color:var(--ink-2);transition:background .12s;line-height:1}
.fmt-btn:hover{background:var(--s2)}
.fmt-btn.b{font-weight:800}
.fmt-btn.i{font-style:italic}
.fmt-btn.u{text-decoration:underline}
.fmt-btn.s{text-decoration:line-through}
.compose-area{width:100%;min-height:100px;border:1.5px solid var(--border);border-radius:var(--radius);padding:12px 14px;font-size:14.5px;font-family:inherit;resize:none;outline:none;line-height:1.8;color:var(--ink);background:var(--s2);transition:border-color .15s;overflow-y:hidden}
.compose-area:empty::before{content:attr(data-placeholder);color:var(--ink-4);pointer-events:none}
.compose-area:focus{border-color:var(--ink);background:#fff}
.compose-options{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap;align-items:center}
.opt-label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-3);cursor:pointer;user-select:none}
.opt-label input[type=checkbox]{accent-color:var(--ink);width:14px;height:14px;cursor:pointer}
.char-count{font-size:11.5px;color:var(--ink-4);margin-right:auto}
.char-count.warn{color:#f59e0b}
.char-count.err{color:var(--like)}
.loc-btn{background:none;border:1.5px solid var(--border);border-radius:var(--pill);padding:5px 11px;font-size:12px;font-family:inherit;color:var(--ink-3);cursor:pointer;display:flex;align-items:center;gap:5px;transition:background .12s,color .12s,border-color .12s}
.loc-btn:hover{border-color:#bbb;color:var(--ink)}
.loc-btn.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.loc-input-wrap{margin-top:10px}
.loc-input{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:9px 12px;font-size:13px;font-family:inherit;outline:none;background:var(--s2);color:var(--ink);transition:border-color .15s}
.loc-input:focus{border-color:var(--ink);background:#fff}
.img-btn{background:none;border:1.5px solid var(--border);border-radius:var(--pill);padding:5px 11px;font-size:12px;font-family:inherit;color:var(--ink-3);cursor:pointer;display:flex;align-items:center;gap:5px;transition:background .12s,color .12s,border-color .12s}
.img-btn:hover{border-color:#bbb;color:var(--ink)}
.image-preview-wrap{margin-top:10px;position:relative;display:inline-block}
.image-preview-wrap img{max-width:100%;max-height:220px;border-radius:10px;display:block}
.image-remove-btn{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.6);border:none;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;transition:background .12s}
.image-remove-btn:hover{background:rgba(0,0,0,.8)}
.post-image{margin-bottom:11px}
.post-image img{width:100%;max-height:420px;object-fit:cover;border-radius:12px;display:block;cursor:pointer}
.compose-footer{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.compose-trigger{padding:14px 20px;display:flex;gap:12px;align-items:center;cursor:pointer;border-bottom:1px solid var(--b2)}
.compose-trigger:hover{background:var(--s2)}
.compose-trigger-text{font-size:14px;color:var(--ink-3)}
.compose-trigger-arrow{margin-right:auto;color:var(--ink-4);font-size:12px;transition:transform .3s}
.compose-trigger-arrow.open{transform:rotate(180deg)}

/* ── Post card ── */
.post-card{border-bottom:1px solid var(--b2);padding:16px 20px;display:flex;gap:12px;transition:background .1s;position:relative}
.post-card:hover{background:#fafafa}
.post-body{flex:1;min-width:0}
.post-meta{display:flex;align-items:center;gap:7px;margin-bottom:5px;flex-wrap:wrap}
.post-author{font-weight:700;font-size:14px;color:var(--ink);cursor:pointer}
.post-author:hover{text-decoration:underline}
.post-handle{color:var(--ink-3);font-size:12.5px}
.post-time{color:var(--ink-4);font-size:11px;margin-right:auto}
.badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:var(--pill);display:inline-flex;align-items:center;gap:3px}
.badge-friends{background:#e0f2fe;color:#0369a1}
.badge-temp{background:#fef3c7;color:#92400e}
.badge-edited{background:#f3f4f6;color:#6b7280;font-weight:500}
.badge-pinned{background:#fde8e8;color:var(--pin)}
.post-text{font-size:14.5px;line-height:1.78;color:var(--ink);margin-bottom:11px;word-break:break-word}
.post-text b{font-weight:800}
.post-text i{font-style:italic}
.post-text u{text-decoration:underline}
.post-text s{text-decoration:line-through}
.mention-link,.hashtag-link{color:#1d9bf0;cursor:pointer;font-weight:600}
.mention-link:hover,.hashtag-link:hover{text-decoration:underline}
.verified-shine{
  background:linear-gradient(90deg, currentColor 35%, #fff 50%, currentColor 65%);
  background-size:250% 100%;
  -webkit-background-clip:text;
  background-clip:text;
  color:inherit;
  animation:verifiedShine 3.2s ease-in-out infinite;
}
@keyframes verifiedShine{
  0%{background-position:180% 0}
  60%,100%{background-position:-80% 0}
}
.post-location{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-3);margin-bottom:9px}

/* ── Search bar ── */
.search-wrap{padding:12px 20px;border-bottom:1px solid var(--b2)}
.search-box{display:flex;align-items:center;gap:9px;background:var(--s2);border:1.5px solid var(--border);border-radius:var(--pill);padding:9px 16px;transition:border-color .15s}
.search-box:focus-within{border-color:var(--ink);background:#fff}
.search-box svg{flex-shrink:0;color:var(--ink-3)}
.search-input{border:none;background:none;outline:none;flex:1;font-size:13.5px;font-family:inherit;color:var(--ink)}
.search-input::placeholder{color:var(--ink-4)}
.search-clear{background:none;border:none;cursor:pointer;color:var(--ink-4);padding:2px;display:flex}
.search-clear:hover{color:var(--ink)}

/* ── Search results ── */
.search-results{padding:8px 0}
.search-section-title{padding:10px 20px 6px;font-size:12.5px;font-weight:700;color:var(--ink-3)}
.search-user-row{display:flex;align-items:center;gap:11px;padding:10px 20px;cursor:pointer;transition:background .1s}
.search-user-row:hover{background:var(--s2)}
.search-user-info{flex:1;min-width:0}
.search-user-name{font-weight:700;font-size:13.5px}
.search-user-handle{font-size:12px;color:var(--ink-3)}
.search-hashtag-row{display:flex;align-items:center;gap:11px;padding:10px 20px;cursor:pointer;transition:background .1s}
.search-hashtag-row:hover{background:var(--s2)}
.search-hashtag-icon{width:38px;height:38px;border-radius:50%;background:#e8f5fd;color:#1d9bf0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex-shrink:0}
.search-hashtag-info{flex:1;min-width:0}
.search-hashtag-name{font-weight:700;font-size:13.5px;color:var(--ink)}
.search-hashtag-count{font-size:12px;color:var(--ink-3)}

/* ── Hashtag page ── */
.hashtag-header{padding:24px 20px;border-bottom:1px solid var(--b2);text-align:center}
.hashtag-icon-lg{width:60px;height:60px;border-radius:50%;background:#e8f5fd;color:#1d9bf0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px;margin:0 auto 12px}
.hashtag-title{font-weight:800;font-size:20px;color:var(--ink)}
.hashtag-count{color:var(--ink-3);font-size:13px;margin-top:4px}
.hashtag-creator{color:var(--ink-3);font-size:12.5px;margin-top:6px}
.hashtag-creator-link{color:#1d9bf0;cursor:pointer;font-weight:700}
.hashtag-creator-link:hover{text-decoration:underline}

/* ── Actions ── */
.post-actions{display:flex;gap:2px;align-items:center}
.act{background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink-3);font-family:inherit;padding:5px 8px;border-radius:8px;font-weight:500;transition:background .12s,color .12s}
.act:hover{background:var(--s3)}
.act.liked{color:var(--like);font-weight:700}
.act.reposted{color:var(--repost);font-weight:700}
.act.saved{color:var(--save);font-weight:700}
.act.pinned-act{color:var(--pin);font-weight:700}
.act-more{margin-right:auto}

/* ── Post stats ── */
.post-stats{display:flex;gap:14px;margin-top:8px;padding-top:8px;border-top:1px solid var(--b2)}
.pstat{font-size:11px;color:var(--ink-4);display:flex;align-items:center;gap:4px}

/* ── Comments ── */
.cmts-drawer{overflow:hidden;max-height:0;transition:max-height .32s cubic-bezier(.4,0,.2,1)}
.cmts-drawer.open{max-height:800px}
.cmts-inner{border-top:1px solid var(--b2);padding-top:10px;margin-top:10px}
.cmt-toggle-btn{background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink-3);font-family:inherit;padding:4px 0;margin-top:6px;transition:color .15s}
.cmt-toggle-btn:hover{color:var(--ink)}
.cmt-toggle-arrow{transition:transform .3s;display:inline-block}
.cmt-toggle-arrow.open{transform:rotate(180deg)}
.cmt-item{display:flex;gap:9px;margin-bottom:8px;align-items:flex-start}
.cmt-bubble{background:var(--s2);border-radius:10px;padding:8px 12px;flex:1}
.cmt-bubble-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.cmt-name{font-weight:700;font-size:12px;color:#333}
.cmt-text{font-size:12.5px;color:#555;margin-top:2px;line-height:1.6}
.cmt-priv-badge{font-size:9.5px;font-weight:700;background:#f3eeff;color:#7c3aed;padding:1px 6px;border-radius:var(--pill);margin-right:4px}
.cmt-menu-btn{background:none;border:none;cursor:pointer;color:var(--ink-3);padding:2px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;transition:background .12s,color .12s}
.cmt-menu-btn:hover{background:var(--s3);color:var(--ink)}
.cmt-edit-input{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12.5px;font-family:inherit;outline:none;background:#fff;color:var(--ink)}
.cmt-edit-input:focus{border-color:var(--ink)}
.cmt-edit-actions{display:flex;gap:7px;margin-top:6px}
.cmt-edit-save{background:var(--ink);color:#fff;border:none;border-radius:var(--pill);padding:4px 12px;font-size:11px;font-weight:700;font-family:inherit;cursor:pointer}
.cmt-edit-cancel{background:none;border:1.5px solid var(--border);border-radius:var(--pill);padding:4px 12px;font-size:11px;font-family:inherit;color:var(--ink-2);cursor:pointer}
.cmt-row{display:flex;gap:7px;margin-top:10px;padding-top:8px;border-top:1px solid var(--b2);align-items:center;flex-wrap:wrap}
.cmt-input{flex:1;min-width:100px;border:1.5px solid var(--border);border-radius:var(--pill);padding:8px 13px;font-size:13px;font-family:inherit;outline:none;background:var(--s2);color:var(--ink);transition:border-color .15s}
.cmt-input:focus{border-color:var(--ink);background:#fff}
.cmt-priv-lbl{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-3);cursor:pointer;white-space:nowrap}
.cmt-priv-lbl input{accent-color:#7c3aed;width:13px;height:13px;cursor:pointer}
.cmt-send{background:var(--ink);color:#fff;border:none;border-radius:var(--pill);padding:8px 14px;cursor:pointer;font-size:12px;font-weight:700;font-family:inherit;white-space:nowrap}
.cmt-send:hover{background:#333}

/* ── Avatar ── */
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-family:inherit;user-select:none;flex-shrink:0;cursor:pointer;transition:opacity .15s;overflow:hidden}
.avatar:hover{opacity:.85}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.av-md{width:42px;height:42px;font-size:16px}
.av-sm{width:29px;height:29px;font-size:11px}
.av-lg{width:66px;height:66px;font-size:25px;border:3px solid #fff}
.avatar-edit-btn{position:absolute;bottom:-2px;left:-2px;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;border:2px solid var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:opacity .15s}
.avatar-edit-btn:hover{opacity:.85}

/* ── Profile ── */
.profile-cover{height:96px;background:linear-gradient(135deg,#0a0a0a 0%,#1a1a2e 50%,#2d1b4e 100%);background-size:cover;background-position:center;position:relative}
.cover-edit-btn{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:var(--pill);padding:6px 12px;font-size:12px;font-family:inherit;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px}
.cover-edit-btn:hover{background:rgba(0,0,0,.75)}
.profile-av-wrap{position:absolute;bottom:-32px;right:20px}
.profile-info{padding:44px 20px 16px;border-bottom:1px solid var(--b2);position:relative}
.profile-name{font-weight:800;font-size:19px}
.profile-handle{color:var(--ink-3);font-size:13px;margin:2px 0 7px}
.profile-bio{color:var(--ink-2);font-size:13.5px;margin-bottom:13px;line-height:1.65}
.profile-stats-row{display:flex;gap:18px;margin-bottom:13px}
.pst{font-size:13px;color:var(--ink-3)}.pst b{color:var(--ink);font-weight:800}
.profile-btns{display:flex;gap:7px;flex-wrap:wrap;align-items:center}

/* ── Three-dot menu ── */
.menu-wrap{position:relative;display:inline-block}
.menu-btn{background:none;border:1.5px solid var(--border);border-radius:var(--pill);padding:6px 12px;cursor:pointer;color:var(--ink-3);font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center;transition:border-color .15s,color .15s;letter-spacing:2px}
.menu-btn:hover{border-color:#bbb;color:var(--ink)}
.dropdown{position:fixed;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.22);min-width:180px;z-index:600;overflow:hidden;display:none}
.dropdown.open{display:block}
.dropdown-item{display:block;width:100%;background:none;border:none;padding:13px 18px;text-align:right;font-size:14px;font-family:inherit;cursor:pointer;color:var(--ink);transition:background .1s}
.dropdown-item:hover{background:var(--s2)}
.dropdown-item.danger{color:#dc2626}
.dropdown-item.danger:hover{background:#fef2f2}
.dropdown-item.cmt-delete{color:#fff;background:#dc2626;font-weight:700;margin:4px 6px;width:calc(100% - 12px);border-radius:8px}
.dropdown-item.cmt-delete:hover{background:#b91c1c}
.dropdown-divider{height:1px;background:var(--b2);margin:2px 0}

/* ── Friends view ── */
.friends-section{padding:14px 20px}
.section-title{font-size:13.5px;font-weight:700;color:var(--ink-2);margin-bottom:10px}
.person-row{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--b2)}
.person-info{flex:1;min-width:0}
.person-name{font-weight:700;font-size:13.5px;cursor:pointer}.person-name:hover{text-decoration:underline}
.person-handle{font-size:12px;color:var(--ink-3)}

/* ── Buttons ── */
.btn{border:none;border-radius:var(--pill);padding:7px 18px;cursor:pointer;font-size:13px;font-weight:700;font-family:inherit;transition:background .15s,opacity .15s}
.btn-primary{background:var(--ink);color:#fff}.btn-primary:hover{background:#222}
.btn-primary:disabled{background:#ccc;cursor:not-allowed}
.btn-ghost{background:none;border:1.5px solid var(--border);color:var(--ink-2)}.btn-ghost:hover{border-color:#bbb;color:var(--ink)}
.btn-follow{background:#0ea5e9;color:#fff;font-size:12.5px;padding:6px 14px}.btn-follow:hover{background:#0284c7}
.btn-unfollow{background:none;border:1.5px solid var(--border);color:var(--ink-2);font-size:12.5px;padding:6px 14px}.btn-unfollow:hover{border-color:#bbb}
.btn-friend{background:var(--ink);color:#fff;font-size:12.5px;padding:6px 14px}
.btn-pending{background:none;border:1.5px solid var(--border);color:var(--ink-3);font-size:12px;padding:5px 12px;cursor:default}
.btn-accept{background:var(--repost);color:#fff;font-size:12px;padding:5px 12px}.btn-accept:hover{background:#15a357}
.btn-reject{background:none;border:1.5px solid var(--border);color:var(--ink-3);font-size:12px;padding:5px 12px}.btn-reject:hover{border-color:#bbb}
.btn-danger{background:none;border:1.5px solid #fca5a5;color:#dc2626;font-size:12px;padding:5px 12px}.btn-danger:hover{background:#fef2f2}
.btn-sm{padding:5px 14px;font-size:12px}

/* ── Auth ── */
.auth-page{max-width:360px;margin:48px auto;padding:0 20px}
.auth-title{font-weight:800;font-size:22px;margin-bottom:5px}
.auth-sub{color:var(--ink-3);font-size:13.5px;margin-bottom:26px}
.auth-fields{display:flex;flex-direction:column;gap:13px}
.field-group{display:flex;flex-direction:column;gap:5px}
.field-label{font-size:10.5px;font-weight:700;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.field-input{border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;font-size:13.5px;font-family:inherit;outline:none;background:var(--s2);color:var(--ink);transition:border-color .15s}
.field-input:focus{border-color:var(--ink);background:#fff}
.auth-error{background:#fff0f3;border:1px solid #ffd0db;border-radius:10px;padding:9px 13px;color:#c0143c;font-size:12.5px}
.auth-hint{text-align:center;font-size:11px;color:var(--ink-4)}
.auth-switch{text-align:center;font-size:13px;color:var(--ink-3)}
.auth-link{color:var(--ink);font-weight:700;cursor:pointer;text-decoration:underline}

/* ── Misc ── */
.notif-dot{display:inline-block;width:7px;height:7px;background:var(--like);border-radius:50%;vertical-align:middle}
.empty{padding:48px 20px;text-align:center;color:var(--ink-4);font-size:13.5px}
.section-gap{height:12px;background:var(--bg)}

/* ── Stories ── */
.story-tray{display:flex;gap:12px;padding:12px 20px;overflow-x:auto;border-bottom:1px solid var(--b2);scrollbar-width:none}
.story-tray::-webkit-scrollbar{display:none}
.story-item{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;flex-shrink:0;width:64px}
.story-ring{width:60px;height:60px;border-radius:50%;padding:2.5px;background:linear-gradient(135deg,#f59e0b,#e0245e,#7c3aed);position:relative}
.story-ring.seen{background:var(--ink-4)}
.story-ring.none{background:none;border:1.5px dashed var(--ink-4);padding:2px}
.story-av{width:100%;height:100%;font-size:18px;border:2.5px solid var(--surface)}
.story-plus{position:absolute;bottom:-3px;left:-3px;width:21px;height:21px;border-radius:50%;background:#0ea5e9;color:#fff;border:2px solid var(--surface);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;line-height:1}
.story-name{font-size:11px;color:var(--ink-2);max-width:64px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.story-viewer{position:fixed;inset:0;z-index:1000;background:#000;display:flex;align-items:center;justify-content:center}
.story-stage{position:relative;width:100%;max-width:480px;height:100%;background:#111;overflow:hidden;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.story-bars{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:4px;z-index:3;direction:rtl}
.story-bar{flex:1;height:3px;background:rgba(255,255,255,.35);border-radius:2px;overflow:hidden}
.story-bar-fill{height:100%;width:100%;background:#fff;transform-origin:right center;transform:scaleX(0)}
.story-bar-fill.done{transform:scaleX(1)}
.story-bar-fill.run{animation:storyFill 5s linear forwards}
.story-bar-fill.paused{animation-play-state:paused}
@keyframes storyFill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.story-head{position:absolute;top:22px;left:12px;right:12px;display:flex;align-items:center;gap:9px;z-index:3;color:#fff}
.story-close{margin-right:auto;background:none;border:none;color:#fff;font-size:22px;cursor:pointer;padding:4px 8px;line-height:1}
.story-img{width:100%;height:100%;object-fit:contain;display:block}
.story-text-bg{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.story-text{padding:36px;font-size:24px;font-weight:700;color:#fff;text-align:center;line-height:1.75;word-break:break-word}
.story-caption{position:absolute;bottom:70px;left:0;right:0;padding:26px 20px 12px;color:#fff;text-align:center;background:linear-gradient(transparent,rgba(0,0,0,.65));font-size:14px;line-height:1.7;z-index:1}
.story-zone{position:absolute;top:70px;bottom:80px;width:50%;z-index:2}
.story-foot{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:space-between;padding:0 16px;z-index:4}
.story-btn{background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:var(--pill);padding:8px 14px;font-size:12.5px;font-family:inherit;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
.story-sheet{position:absolute;inset:0;z-index:10;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.5)}
.story-sheet-card{background:var(--surface);color:var(--ink);width:100%;max-width:480px;max-height:60vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:14px 18px 20px}
.story-composer{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.story-composer-card{background:var(--surface);color:var(--ink);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:16px 20px 22px;max-height:94vh;overflow-y:auto}
.story-preview{height:270px;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#1a1a2e;color:#fff;position:relative}
.story-textarea{width:100%;height:100%;background:transparent;border:none;outline:none;resize:none;color:#fff;font-family:inherit;font-size:22px;font-weight:700;text-align:center;line-height:1.7;padding:26px}
.story-textarea::placeholder{color:rgba(255,255,255,.6)}
.story-preview-img{width:100%;height:100%;object-fit:contain;cursor:pointer}
.story-pick{background:rgba(255,255,255,.15);color:#fff;border:1.5px dashed rgba(255,255,255,.6);border-radius:var(--pill);padding:10px 20px;font-family:inherit;font-size:13px;cursor:pointer}
.story-colors{display:flex;gap:9px;margin-top:12px;flex-wrap:wrap}
.story-color{width:30px;height:30px;border-radius:50%;border:2.5px solid transparent;cursor:pointer;outline:1.5px solid var(--border)}
.story-color.sel{border-color:var(--surface);outline:2.5px solid var(--ink)}

@media(max-width:640px){
  .shell{border:none;min-height:100dvh}
  .header{padding:0 10px;height:52px}
  .logo{font-size:17px}
  .nb{padding:5px 8px;font-size:12px;gap:3px}
  .nb svg{width:13px;height:13px}
  .post-card{padding:12px 14px;gap:10px}
  .av-md{width:36px;height:36px;font-size:13px}
  .post-author{font-size:13px}
  .post-handle{font-size:11.5px}
  .post-text{font-size:13.5px}
  .act{padding:4px 6px;font-size:12px}
  .act svg{width:14px;height:14px}
  .compose-drawer-inner{padding:12px 14px}
  .compose-area{font-size:13.5px}
  .compose-options{gap:10px}
  .opt-label{font-size:12px}
  .compose-trigger{padding:12px 14px}
  .compose-trigger-text{font-size:13px}
  .profile-cover{height:80px}
  .av-lg{width:56px;height:56px;font-size:20px}
  .profile-av-wrap{bottom:-28px;right:14px}
  .profile-info{padding:38px 14px 14px}
  .profile-name{font-size:17px}
  .profile-handle{font-size:12px}
  .profile-bio{font-size:13px}
  .profile-stats-row{gap:12px}
  .pst{font-size:12px}
  .friends-section{padding:12px 14px}
  .person-row{gap:9px}
  .auth-page{margin:28px auto;padding:0 16px}
  .auth-title{font-size:20px}
  .field-input{font-size:13px;padding:9px 11px}
  .btn{padding:7px 14px;font-size:12.5px}
  .tabs .tab{font-size:13px;padding:11px 0}
  .cmt-input{font-size:12.5px;padding:7px 11px}
  .pinned-header{padding:8px 14px 4px}
  .compose-footer{flex-direction:row;gap:8px}
  .char-count{font-size:11px}
  .post-stats{margin-top:6px;padding-top:6px}
  .pstat{font-size:10.5px}
  .section-gap{height:8px}
  .cmt-toggle-btn{font-size:12px}
  .badge{font-size:9.5px;padding:2px 6px}
  .post-meta{gap:5px}
  .post-time{font-size:10.5px}
}
</style>
</head>
<body>
<div class="shell">

<!-- ═══ HEADER ═══ -->
<header class="header">
  <div class="logo" onclick="showFeed()">خودکار</div>
  <nav class="nav" id="main-nav">
    <button class="nb active" id="nav-feed" onclick="showFeed()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      خانه
    </button>
    <button class="nb" id="nav-discover" onclick="showDiscover()" style="display:none">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
      کشف
    </button>
    <button class="nb" id="nav-friends" onclick="showFriends()" style="display:none">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      دوستان<span id="req-dot" style="display:none"> <span class="notif-dot"></span></span>
    </button>
    <button class="nb" id="nav-notif" onclick="showNotifications()" style="display:none;position:relative">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span id="notif-badge" class="notif-badge" style="display:none">0</span>
    </button>
    <button class="nb" id="nav-profile" onclick="showMyProfile()" style="display:none">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      من
    </button>
    <button class="nb primary" id="nav-login" onclick="showLogin()">ورود</button>
    <button class="nb ghost" id="nav-logout" onclick="doLogout()" style="display:none;font-size:12px">خروج</button>
    <button class="theme-toggle" id="theme-toggle" onclick="toggleDarkMode()" title="تغییر تم">
      <svg id="theme-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>
  </nav>
</header>

<!-- ═══ TOAST ═══ -->
<div class="toast" id="toast"></div>

<!-- ═══════════════════ FEED ═══════════════════ -->
<div class="view active" id="view-feed">

  <div class="search-wrap">
    <div class="search-box">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input class="search-input" id="feed-search-input" type="text" placeholder="جستجوی افراد، پست‌ها، هشتگ‌ها..." oninput="onFeedSearchInput()">
      <button class="search-clear" id="feed-search-clear" style="display:none" onclick="clearFeedSearch()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
  </div>
  <div id="feed-search-results" style="display:none"></div>

  <div id="feed-body-content">
  <div id="compose-trigger-wrap" style="display:none">
    <div class="compose-trigger" id="compose-trigger" onclick="toggleDrawer()">
      <div class="avatar av-md" id="quick-avatar"></div>
      <span class="compose-trigger-text">پست گذاشتن</span>
      <svg class="compose-trigger-arrow" id="drawer-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="compose-drawer" id="compose-drawer">
      <div class="compose-drawer-inner">
        <div class="compose-toolbar" style="justify-content:space-between">
          <div style="display:flex;gap:4px">
            <button class="fmt-btn b" onclick="applyFmt('b')" title="درشت"><b>ب</b></button>
            <button class="fmt-btn i" onclick="applyFmt('i')" title="کج"><i>ک</i></button>
            <button class="fmt-btn u" onclick="applyFmt('u')" title="زیرخط"><u>ز</u></button>
            <button class="fmt-btn s" onclick="applyFmt('s')" title="روخط"><s>ر</s></button>
          </div>
          <span id="compose-title-text" style="font-size:12px;font-weight:700;color:var(--ink-3)">پست جدید</span>
        </div>
        <div id="compose-area-wrap" style="position:relative">
          <div class="compose-area" id="compose-area" contenteditable="true" data-placeholder="چه چیزی در ذهن دارید؟ (۱ تا ۱۵۰ کاراکتر)" oninput="onComposeInput()" onkeydown="handleComposeKey(event)"></div>
        </div>
        <div class="compose-options">
          <label class="opt-label" title="پست فقط برای دوستان شما">
            <input type="checkbox" id="opt-friends"> دوستان
          </label>
          <label class="opt-label" title="پست ۲۴ ساعت بعد حذف می‌شود">
            <input type="checkbox" id="opt-temp"> موقت
          </label>
          <button type="button" class="loc-btn" id="loc-btn" onclick="toggleLocationInput()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            مکان

  const map={};

async function loadAllData(){
  try{
    const { data: usersData, error: usersErr } = await sb.from('users').select('*');
    if(usersErr) throw new Error('users: '+usersErr.message);
    Object.keys(users).forEach(k=>delete users[k]);
    (usersData||[]).forEach(u=>{
      users[u.handle] = { name:u.name||u.handle, handle:u.handle, bio:u.bio||'', avatar:u.avatar||(u.name||u.handle||'?')[0], avatarUrl:u.avatar_url||null, coverUrl:u.cover_url||null, verified:u.is_verified||false };
    });

    const { data: followsData } = await sb.from('follows').select('*');
    Object.keys(follows).forEach(k=>delete follows[k]);
    (followsData||[]).forEach(f=>{
      if(!follows[f.follower_handle]) follows[f.follower_handle]=new Set();
      follows[f.follower_handle].add(f.following_handle);
    });

    const { data: friendData } = await sb.from('friendships').select('*');
    Object.keys(friends).forEach(k=>delete friends[k]);
    Object.keys(friendReqs).forEach(k=>delete friendReqs[k]);
    (friendData||[]).forEach(f=>{
      if(f.status==='accepted'){
        if(!friends[f.user_a]) friends[f.user_a]=new Set();
        if(!friends[f.user_b]) friends[f.user_b]=new Set();
        friends[f.user_a].add(f.user_b);
        friends[f.user_b].add(f.user_a);
      } else if(f.status==='pending'){
        const to = f.requested_by===f.user_a ? f.user_b : f.user_a;
        if(!friendReqs[to]) friendReqs[to]=new Set();
        friendReqs[to].add(f.requested_by);
      }
    });

    const { data: savedData } = await sb.from('saved_posts').select('*');
    Object.keys(savedByUser).forEach(k=>delete savedByUser[k]);
    (savedData||[]).forEach(s=>{
      if(!savedByUser[s.user_handle]) savedByUser[s.user_handle]=new Set();
      savedByUser[s.user_handle].add(s.post_id);
    });

    const { data: repostData, error: repostErr } = await sb.from('reposts').select('*');
    if(repostErr) console.warn('reposts:', repostErr.message);
    repostList=(repostData||[]).map(r=>({ id:r.id, user:r.user_handle, postId:r.post_id, createdAt:new Date(r.created_at).getTime() }));

    const { data: storyData, error: storyErr } = await sb.from('stories').select('*').gt('expires_at', new Date().toISOString()).order('created_at',{ascending:true});
    if(storyErr) console.warn('stories:', storyErr.message);
    stories=(storyData||[]).map(x=>({
      id:x.id, author:x.author_handle, imageUrl:x.image_url||null, text:x.text_content||'',
      caption:x.caption||'', bg:x.bg_color||'#1a1a2e', privacy:x.privacy||'public',
      createdAt:new Date(x.created_at).getTime(), expiresAt:new Date(x.expires_at).getTime()
    }));
    const { data: svData } = await sb.from('story_views').select('*');
    storyViews={};
    (svData||[]).forEach(v=>{ (storyViews[v.story_id]=storyViews[v.story_id]||new Set()).add(v.viewer_handle); });

    const { data: postsData, error: postsErr } = await sb.from('posts').select('*').order('created_at',{ascending:false});
    if(postsErr) throw new Error('posts: '+postsErr.message);

    const { data: commentsData } = await sb.from('comments').select('*');

    posts = (postsData||[]).map(p=>{
      const d = new Date(p.created_at);
      const [jy,jm,jd]=toJalali(d.getFullYear(), d.getMonth()+1, d.getDate());
      const pad=n=>String(n).padStart(2,'0');
      const timeStr = `${toFaDigits(jd)} ${JALALI_MONTHS[jm-1]} ${toFaDigits(jy)} · ${toFaDigits(pad(d.getHours()))}:${toFaDigits(pad(d.getMinutes()))}`;
      return {
        id: p.id,
        author: p.author_handle,
        content: p.content,
        html: p.html,
        privacy: p.privacy,
        isTemp: p.is_temp,
        isPinned: p.is_pinned||false,
        location: p.location||null,
        imageUrl: p.image_url||null,
        edited: p.edited,
        createdAt: d.getTime(),
        time: timeStr,
        likes: p.likes||0,
        likedBy: p.liked_by||[],
        reposts: p.reposts||0,
        repostedBy: p.reposted_by||[],
        views: p.views||0,
        comments: (commentsData||[]).filter(c=>c.post_id===p.id).map(c=>({
          id: c.id, author: c.author_handle, text: c.text, isPrivate: c.is_private
        })),
      };
    });
    rebuildRepostDerived();

  } catch(err){
    console.error('Error loading data:', err);
    notify('خطا در بارگذاری داده‌ها: '+((err&&err.message)||err));
    const fe=document.getElementById('feed-list');

// Gregorian to Jalali (Persian) date conversion
function toJalali(gy, gm, gd) {
  const g_d_m = [0,31,59,90,120,151,181,212,243,273,304,334];
  let jy = (gy <= 1600) ? 0 : 979;
  gy -= (gy <= 1600) ? 621 : 1600;
  const gy2 = (gm > 2) ? (gy + 1) : gy;
  let days = (365*gy) + (parseInt((gy2+3)/4)) - (parseInt((gy2+99)/100)) + (parseInt((gy2+399)/400)) - 80 + gd + g_d_m[gm-1];
  jy += 33*(parseInt(days/12053));
  days %= 12053;
  jy += 4*(parseInt(days/1461));
  days %= 1461;
  if (days > 365) {
    jy += parseInt((days-1)/365);
    days = (days-1)%365;
  }
  let jm, jd;
  if (days < 186) {
    jm = 1 + parseInt(days/31);
    jd = 1 + (days%31);
  } else {
    jm = 7 + parseInt((days-186)/30);
    jd = 1 + ((days-186)%30);
  }
  return [jy, jm, jd];
}
const JALALI_MONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const FA_DIGITS=['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
function toFaDigits(n){ return String(n).replace(/[0-9]/g, d=>FA_DIGITS[d]); }
function nowStr(){
  const d=new Date();
  const [jy,jm,jd]=toJalali(d.getFullYear(), d.getMonth()+1, d.getDate());
  const pad=n=>String(n).padStart(2,'0');
  return `${toFaDigits(jd)} ${JALALI_MONTHS[jm-1]} ${toFaDigits(jy)} · ${toFaDigits(pad(d.getHours()))}:${toFaDigits(pad(d.getMinutes()))}`;
}
function tsNow(){ return Date.now(); }

function isFriend(a,b){ return friends[a]&&friends[a].has(b)&&friends[b]&&friends[b].has(a); }
function isFollowing(a,b){ return follows[a]&&follows[a].has(b); }
function hasPendingReq(from,to){ return friendReqs[to]&&friendReqs[to].has(from); }

function ensureSocial(h){
  if(!follows[h])    follows[h]=new Set();
  if(!friends[h])    friends[h]=new Set();
  if(!friendReqs[h]) friendReqs[h]=new Set();
  if(!savedByUser[h])savedByUser[h]=new Set();
}

function canSee(post, viewer){
  if(post.privacy==='friends') return viewer===post.author || (viewer && isFriend(viewer,post.author));
  return true;
}
function canSeeComment(c, postAuthor, viewer){
  if(!c.isPrivate) return true;
  if(!viewer) return false;
  if(viewer===c.author||viewer===postAuthor) return true;
  if(isFriend(viewer,c.author)&&isFriend(viewer,postAuthor)) return true;
  return false;
}

function isExpired(post){
  if(!post.isTemp) return false;
  return (tsNow() - post.createdAt) > 24*60*60*1000;
}

function getAllHashtagsInfo(){
  const info={};
  posts.forEach(p=>{
    if(isExpired(p)) return;
    if(!canSee(p,currentUser)) return;
    extractHashtags(p.content).forEach(tag=>{
      if(!info[tag]) info[tag]={count:0, creator:p.author, earliestTime:p.createdAt};
      info[tag].count++;
      if(p.createdAt < info[tag].earliestTime){
        info[tag].earliestTime = p.createdAt;
        info[tag].creator = p.author;
      }
    });
  });
  return info;
}

function runFeedSearch(qRaw){
  const container=document.getElementById('feed-search-results');
  const q=(qRaw||'').trim().toLowerCase().replace(/^@/,'').replace(/^#/,'');

  if(!q){
    container.innerHTML='';
    return;
  }

  const userMatches=Object.values(users).filter(u=>
    u.name.toLowerCase().includes(q) || u.handle.toLowerCase().includes(q)
  );

  const allTags=getAllHashtagsInfo();
  const tagMatches=Object.keys(allTags).filter(t=>t.toLowerCase().includes(q));

  const postMatches=posts.filter(p=>!isExpired(p) && canSee(p,currentUser) && p.content.toLowerCase().includes(q));

  let html='';

  if(userMatches.length>0){
    html+=`<div class="search-section-title">افراد</div>`;
    userMatches.forEach(u=>{
      html+=`<div class="search-user-row" onclick="showProfile('${u.handle}')">
        <div class="avatar av-md" style="background:${avatarBg(u.handle)}">${avatarInner(u.handle)}</div>
        <div class="search-user-info">
          <div class="search-user-name">${shine(escH(u.name),u.handle)}${verifiedBadge(u.handle)}</div>
          <div class="search-user-handle">@${u.handle}</div>
        </div>
      </div>`;
    });
  }

  if(tagMatches.length>0){
    html+=`<div class="search-section-title">هشتگ‌ها</div>`;
    tagMatches.forEach(tag=>{
      html+=`<div class="search-hashtag-row" onclick="showHashtag('${tag}')">
        <div class="search-hashtag-icon">#</div>
        <div class="search-hashtag-info">
          <div class="search-hashtag-name">#${escH(tag)}</div>
          <div class="search-hashtag-count">${allTags[tag].count} پست · ساخته شده توسط @${allTags[tag].creator}</div>
        </div>
      </div>`;
    });
  }

  if(postMatches.length>0){
    html+=`<div class="search-section-title">پست‌ها</div>`;
    html+=postMatches.map(p=>renderPostCard(p)).join('');
  }

  if(userMatches.length===0 && tagMatches.length===0 && postMatches.length===0){
    html='<div class="empty">نتیجه‌ای یافت نشد.</div>';
  }

  container.innerHTML=html;
  attachPostEvents(container);
}

function extFromImageType(type){
  if(type.includes('png')) return 'png';
  if(type.includes('webp')) return 'webp';
  if(type.includes('gif')) return 'gif';
  return 'jpg';
}
async function uploadSelectedImage(){
  const ext=extFromImageType(selectedImageFile.type);
  const fileName=`${currentUser}/${Date.now()}.${ext}`;
  const { error: upErr } = await sb.storage.from(IMAGE_BUCKET).upload(fileName, selectedImageFile, { contentType: selectedImageFile.type });
  if(upErr){ notify('خطا در آپلود عکس: '+upErr.message); return undefined; }
  const { data } = sb.storage.from(IMAGE_BUCKET).getPublicUrl(fileName);
  return (data && data.publicUrl) || null;
}

async function doPost(){
  if(!currentUser) return;
  const area=document.getElementById('compose-area');
  const rawText=area.textContent.trim();
  if(rawText.length<1||rawText.length>150){ notify('پست باید بین ۱ تا ۱۵۰ کاراکتر باشد.'); return; }

  if(!editingPostId){
    const wait=POST_RATE_LIMIT_MS-(Date.now()-lastPostSubmittedAt);
    if(wait>0){ notify(`لطفاً ${toFaDigits(Math.ceil(wait/1000))} ثانیه دیگر صبر کن.`); return; }
  }

  const html=area.innerHTML.trim();
  const isFriends=document.getElementById('opt-friends').checked;
  const isTemp=document.getElementById('opt-temp').checked;
  const location=document.getElementById('opt-location').value.trim()||null;

  let imageUrl=existingImageUrl;
  const submitBtn=document.getElementById('compose-submit');
  const originalBtnText=submitBtn.textContent;
  if(selectedImageFile){
    submitBtn.disabled=true;
    submitBtn.textContent='در حال آپلود عکس...';
    const uploaded=await uploadSelectedImage();
    submitBtn.disabled=false;
    submitBtn.textContent=originalBtnText;
    if(uploaded===undefined) return;
    imageUrl=uploaded;
  }

  if(editingPostId){
    const { error: editErr } = await sb.from('posts').update({
      content: rawText,
      html: html,
      privacy: isFriends?'friends':'public',
      is_temp: isTemp,
      location: location,
      image_url: imageUrl,
      edited: true,
    }).eq('id', editingPostId);

    if(editErr){ notify('خطا در ویرایش پست.'); return; }

    editingPostId=null;
    document.getElementById('compose-submit').textContent='انتشار';
    document.getElementById('compose-title-text').textContent='پست جدید';
    area.innerHTML='';
    document.getElementById('opt-friends').checked=false;
    document.getElementById('opt-temp').checked=false;
    resetLocationField();
    resetImageField();
    updateCharCount(); updateComposeBtn();
    closeDrawer();
    notify('پست ویرایش شد.');
    await loadAllData();
    refreshView();
    return;
  }

  const { data: newPostData, error } = await sb.from('posts').insert({
    author_handle: currentUser,
    content: rawText,
    html: html,
    privacy: isFriends?'friends':'public',
    is_temp: isTemp,
    location: location,
    image_url: imageUrl,
    is_pinned: false,
    edited: false,
    likes:0, liked_by:[],
    reposts:0, reposted_by:[],
    views:0,
  }).select().single();

  if(error){ notify('خطا در ارسال پست: '+error.message); return; }

  if(!isFriends && newPostData) notifyMentions(rawText, newPostData.id, null);
  lastPostSubmittedAt=Date.now();
  area.innerHTML='';
  document.getElementById('opt-friends').checked=false;
  document.getElementById('opt-temp').checked=false;
  resetLocationField();
  resetImageField();
  updateCharCount(); updateComposeBtn();
  closeDrawer();
  notify('پست منتشر شد.');
  await loadAllData();
  renderFeed();
}

function startEditPost(id){
  const post=posts.find(p=>p.id===id);
  if(!post||!currentUser||post.author!==currentUser) return;
  editingPostId=id;

  if(!drawerOpen) toggleDrawer();

  const area=document.getElementById('compose-area');
  area.innerHTML=post.html||escH(post.content);
  document.getElementById('opt-friends').checked = post.privacy==='friends';
  document.getElementById('opt-temp').checked = !!post.isTemp;
  if(post.location){
    document.getElementById('opt-location').value=post.location;
    document.getElementById('loc-input-wrap').style.display='block';
    document.getElementById('loc-btn').classList.add('active');
  } else {
    resetLocationField();
  }
  if(post.imageUrl){
    resetImageField();
    existingImageUrl=post.imageUrl;
    showImagePreview(post.imageUrl);
  } else {
    resetImageField();
  }
  updateCharCount(); updateComposeBtn();

}

function renderTrendingWidget(){
  const wrap=document.getElementById('trending-wrap');
  const pillsEl=document.getElementById('trending-pills');
  if(!wrap||!pillsEl) return;
  const info=getAllHashtagsInfo();
  const top=Object.entries(info).sort((a,b)=>b[1].count-a[1].count).slice(0,6);
  if(top.length===0){ wrap.style.display='none'; return; }
  wrap.style.display='block';
  pillsEl.innerHTML=top.map(([tag,d])=>
    `<button class="trending-pill" onclick="showHashtag('${tag}')">#${escH(tag)}<span class="trending-pill-count">${toFaDigits(d.count)}</span></button>`
  ).join('');
}

// Feed entries: original posts + real reposts (a repost appears at the
// time it was made, with the reposter's name on top).
function buildEntries(filterFn){
  const byId={}; posts.forEach(p=>{ byId[p.id]=p; });
  const list=[];
  posts.forEach(p=>{ if(!isExpired(p)&&canSee(p,currentUser)) list.push({post:p,by:null,ts:p.createdAt}); });
  repostList.forEach(r=>{
    const p=byId[r.postId];
    if(p&&!isExpired(p)&&canSee(p,currentUser)) list.push({post:p,by:r.user,ts:r.createdAt});
  });
  return list.filter(filterFn).sort((a,b)=>b.ts-a.ts);
}

function renderFeed(){
  posts=posts.filter(p=>!isExpired(p));
  renderTrendingWidget();
  renderStoryTray();
  const container=document.getElementById('feed-list');

  let filter=()=>true;
  if(feedTab==='friends'){
    if(!currentUser){ container.innerHTML='<div class="empty">برای دیدن پست دوستان وارد شوید.</div>'; return; }
    ensureSocial(currentUser);
    filter=e=>{ const u=e.by||e.post.author; return u===currentUser||friends[currentUser].has(u); };
  }
  const entries=buildEntries(filter);
  if(entries.length===0){
    container.innerHTML='<div class="empty">هنوز پستی وجود ندارد.</div>';
    return;
  }
  container.innerHTML=entries.map(e=>renderPostCard(e.post,{repostBy:e.by})).join('');
  attachPostEvents(container);
}

  const displayHandle=authorHandle;

  const reposted=currentUser&&post.repostedBy.includes(currentUser);

  const isOwn=currentUser&&post.author===currentUser;

  let badges='';

  if(post.isTemp)  badges+=`<span class="badge badge-temp">موقت</span>`;
  if(post.edited)  badges+=`<span class="badge badge-edited">ویرایش‌شده</span>`;
  if(post.isPinned && opts.allowPin) badges+=`<span class="badge badge-pinned">${icoPinSmall()}سنجاق‌شده</span>`;

  const imageHtml=post.imageUrl?`<div class="post-image"><img src="${escH(post.imageUrl)}" alt="" onclick="window.open('${escH(post.imageUrl)}','_blank')"></div>`:'';

  const visCmts=post.comments.filter(c=>canSeeComment(c,post.author,currentUser));
  const cmtLabel = visCmts.length>0 ? `${visCmts.length} دیدگاه` : 'دیدگاه';
  const cmtsHtml=`
    <button class="cmt-toggle-btn" data-cmt-toggle>
      <span class="cmt-toggle-arrow" data-cmt-arrow>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </span>

    </button>

      <div class="cmts-inner" data-cmts-inner>
        ${visCmts.map(c=>commentItemHTML(c)).join('')}
        <div class="cmt-row" data-cmt-row>
          ${currentUser?`<div class="avatar av-sm" style="background:${avatarBg(currentUser)}">${avatarInner(currentUser)}</div>`:''}
          <input class="cmt-input" type="text" placeholder="دیدگاه بنویس..." data-cmt-input>
          <label class="cmt-priv-lbl"><input type="checkbox" data-cmt-priv> خصوصی</label>

      </button>
      <div class="dropdown" id="pmenu-${post.id}" style="min-width:150px">

function attachPostEvents(container){
  container.querySelectorAll('.post-card').forEach(card=>{
    const id=card.dataset.id;
    if(!viewedPostIds.has(id)) getPostViewObserver().observe(card);
    card.querySelector('[data-action="like"]')?.addEventListener('click',()=>toggleLike(id));
    card.querySelector('[data-action="repost"]')?.addEventListener('click',()=>toggleRepost(id));
    card.querySelector('[data-action="save"]')?.addEventListener('click',()=>toggleSave(id));
    card.querySelector('[data-action="pin"]')?.addEventListener('click',()=>togglePin(id));

    const drawer=card.querySelector('[data-cmts-drawer]');
    const arrow=card.querySelector('[data-cmt-arrow]');
    const toggleDrawerFn=()=>{
      if(!currentUser){showLogin();return;}
      const isOpen=drawer.classList.contains('open');
      drawer.classList.toggle('open',!isOpen);
      if(arrow) arrow.classList.toggle('open',!isOpen);
      if(!isOpen){
        setTimeout(()=>card.querySelector('[data-cmt-input]')?.focus(),340);
      }
    };
    card.querySelector('[data-action="comment-toggle"]')?.addEventListener('click',toggleDrawerFn);
    card.querySelector('[data-cmt-toggle]')?.addEventListener('click',toggleDrawerFn);

    card.querySelectorAll('[data-cmt-item]').forEach(item=>attachCommentItemEvents(item,id,card));

    const inp=card.querySelector('[data-cmt-input]');
    const send=card.querySelector('[data-cmt-send]');
    if(inp&&send){
      const doC=async ()=>{
        const text=inp.value.trim();
        if(!text) return;
        if(!currentUser){showLogin();return;}
        const wait=COMMENT_RATE_LIMIT_MS-(Date.now()-lastCommentSubmittedAt);
        if(wait>0){ notify(`لطفاً ${toFaDigits(Math.ceil(wait/1000))} ثانیه دیگر صبر کن.`); return; }
        const priv=card.querySelector('[data-cmt-priv]');
        const isPrivate=priv&&priv.checked;
        inp.disabled=true; send.disabled=true;

        const { data, error } = await sb.from('comments').insert({
          post_id: id, author_handle: currentUser, text, is_private: isPrivate
        }).select().single();

        inp.disabled=false; send.disabled=false;
        if(error){ notify('خطا در ثبت دیدگاه.'); return; }
        lastCommentSubmittedAt=Date.now();

        const post=posts.find(p=>p.id===id);
        const newComment={ id:data.id, author:currentUser, text, isPrivate };
        if(post){ post.comments.push(newComment); }
        if(!isPrivate){
          if(post && post.author!==currentUser) createNotification('comment', post.author, id, data.id);
          notifyMentions(text, id, data.id);
        }

        const inner=card.querySelector('[data-cmts-inner]');
        const row=card.querySelector('[data-cmt-row]');
        if(inner && row){
          const wrap=document.createElement('div');
          wrap.innerHTML=commentItemHTML(newComment);
          const newItem=wrap.firstElementChild;
          inner.insertBefore(newItem,row);
          attachCommentItemEvents(newItem,id,card);
        }
        updateCommentCountUI(card,id);

        inp.value='';
        if(priv) priv.checked=false;
        notify(isPrivate?'دیدگاه خصوصی ثبت شد.':'دیدگاه ثبت شد.');
      };
      send.addEventListener('click',doC);
      inp.addEventListener('keydown',e=>{ if(e.key==='Enter') doC(); });
    }
  });
}

function attachCommentItemEvents(item, postId, card){
  const commentId=item.dataset.cmtId;
  const bubble=item.querySelector('[data-cmt-bubble]');
  const editBtn=item.querySelector('[data-cmt-edit-btn]');
  const delBtn=item.querySelector('[data-cmt-delete-btn]');
  if(!bubble) return;

  if(editBtn){
    editBtn.addEventListener('click',()=>{
      closeAllMenus();
      const post=posts.find(p=>p.id===postId);
      const c=post&&post.comments.find(x=>x.id===commentId);
      if(!c) return;
      bubble.innerHTML=`
        <input type="text" class="cmt-edit-input" value="${escH(c.text)}" data-cmt-edit-input maxlength="300">
        <div class="cmt-edit-actions">
          <button class="cmt-edit-save" data-cmt-edit-save>ذخیره</button>
          <button class="cmt-edit-cancel" data-cmt-edit-cancel>انصراف</button>
        </div>`;
      const input=bubble.querySelector('[data-cmt-edit-input]');
      input.focus();
      input.setSelectionRange(input.value.length,input.value.length);

      const restore=(comment)=>{
        bubble.innerHTML=commentBubbleInnerHTML(comment);
        attachCommentItemEvents(item,postId,card);
      };

      bubble.querySelector('[data-cmt-edit-cancel]').addEventListener('click',()=>restore(c));
      const save=async ()=>{
        const newText=input.value.trim();
        if(!newText){ notify('متن دیدگاه نمی‌تواند خالی باشد.'); return; }
        c.text=newText;
        restore(c);
        notify('دیدگاه ویرایش شد.');
        const { error } = await sb.from('comments').update({ text:newText }).eq('id', commentId);
        if(error){ notify('خطا در ویرایش دیدگاه.'); }
      };
      bubble.querySelector('[data-cmt-edit-save]').addEventListener('click',save);
      input.addEventListener('keydown',e=>{ if(e.key==='Enter') save(); });
    });
  }

  if(delBtn){
    delBtn.addEventListener('click',async ()=>{
      closeAllMenus();
      const post=posts.find(p=>p.id===postId);
      if(post){ post.comments=post.comments.filter(x=>x.id!==commentId); }
      item.remove();
      updateCommentCountUI(card,postId);
      notify('دیدگاه حذف شد.');
      const { error } = await sb.from('comments').delete().eq('id', commentId);
      if(error){ notify('خطا در حذف دیدگاه از سرور.'); }
    });
  }
}

function updateCommentCountUI(card, postId){
  const post=posts.find(p=>p.id===postId);
  if(!post) return;
  const count=post.comments.filter(c=>canSeeComment(c,post.author,currentUser)).length;
  const toggleBtn=card.querySelector('[data-action="comment-toggle"]');
  if(toggleBtn) toggleBtn.innerHTML=`${icoComment()} ${count>0?count:''}`;
  const label=card.querySelector('[data-cmt-label]');
  if(label) label.textContent = count>0 ? `${count} دیدگاه` : 'دیدگاه';
}

// ═══════════════════════════════════════════
// VIEW COUNTING
// ═══════════════════════════════════════════
function getPostViewObserver(){
  if(postViewObserver) return postViewObserver;
  postViewObserver = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(!entry.isIntersecting) return;
      const card=entry.target;
      postViewObserver.unobserve(card);
      registerPostView(card.dataset.id);
    });
  }, { threshold:0.6 });
  return postViewObserver;
}
async function registerPostView(id){
  if(!id || viewedPostIds.has(id)) return;
  const post=posts.find(p=>p.id===id);
  if(!post) return;
  if(currentUser && post.author===currentUser) return;
  viewedPostIds.add(id);
  const newViews=(post.views||0)+1;
  post.views=newViews;
  document.querySelectorAll(`.post-card[data-id="${id}"] [data-views]`).forEach(el=>{
    el.textContent=`${newViews} بازدید`;
  });
  const { error } = await sb.from('posts').update({ views:newViews }).eq('id', id);
  if(error){ console.error('view count update failed', error); }
}

async function toggleLike(id){
  if(!currentUser){showLogin();return;}
  const p=posts.find(x=>x.id===id);if(!p)return;
  const liked=p.likedBy.includes(currentUser);
  const newLikedBy=liked?p.likedBy.filter(u=>u!==currentUser):[...p.likedBy,currentUser];
  const newLikes=liked?p.likes-1:p.likes+1;

  p.likes=newLikes; p.likedBy=newLikedBy;
  refreshView();

  const { error } = await sb.from('posts').update({ likes:newLikes, liked_by:newLikedBy }).eq('id', id);
  if(error){ notify('خطا در ثبت لایک.'); }
  if(!liked && p.author!==currentUser) createNotification('like', p.author, id, null);
}
async function toggleRepost(id){
  if(!currentUser
